name: Deploy to Firebase Hosting on merge

"on":
  push:
    branches:
      - main

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "true"
      NEXT_PUBLIC_DATA_SOURCE: firestore
      NEXT_PUBLIC_USE_EMULATOR: "false"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: semana5-clara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/out
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEMANA5_CLARA }}
          channelId: live
          projectId: semana5-clara

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Teste de fumaca na URL de producao
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            https://semana5-clara.web.app | grep -q "Semana 5"
