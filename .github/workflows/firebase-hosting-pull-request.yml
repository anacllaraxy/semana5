name: Deploy to Firebase Hosting on PR

"on": pull_request

concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "true"
      NEXT_PUBLIC_DATA_SOURCE: firestore
      NEXT_PUBLIC_USE_EMULATOR: "false"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: semana5-clara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/out

  deploy:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    outputs:
      urls: ${{ steps.firebase.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/out
      - id: firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEMANA5_CLARA }}
          projectId: semana5-clara

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Teste de fumaca na URL de pre-visualizacao
        env:
          URLS: ${{ needs.deploy.outputs.urls }}
        run: |
          URL=$(echo "$URLS" | grep -oE 'https://[^", ]+' | head -1)
          echo "Testando: $URL"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$URL" | grep -q "Semana 5"
